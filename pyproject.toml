[project]
name = "flyBackAndForth"
version = "0.1.0"
description = "A LangGraph agent that finds the best-value flight on a route, in a date window or from a given date."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "airportsdata>=20250101",
]

[project.optional-dependencies]
local = ["langchain-ollama>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flyBackAndForth = "fly_back_and_forth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_back_and_forth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
